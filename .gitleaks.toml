# crash-dash — gitleaks config. Scanned by the pre-ship sweep; a hit here must be a REAL leak.
#
# Every allowlist below was verified false-positive during the 2026-08-18 public-exposure audit
# (finding M-2). The rule is narrow on purpose:
# never blanket-disable `generic-api-key` — a permanently-red scanner is a scanner nobody reads.
#
# Run: `npm run scan:secrets` (clean = ship). Two falsifiers, both of which MUST report a hit —
# a JWT with the CANONICAL `{"alg":"HS256","typ":"JWT"}` header (no spaces) and a non-demo `iss`,
# and a real-shaped key planted INSIDE `src/ecb.ts`. A hand-built JWT whose header carries JSON
# spaces is not the header a real key uses and proves nothing.

[extend]
useDefault = true

[allowlist]
description = "Verified non-secrets: SDMX series ids, gate names, tranche row ids, generated fixtures."

regexes = [
  # `key:` fields holding IDENTIFIERS, not credentials. Matched on the value's SHAPE so the rest of
  # each file stays scanned: ECB SDMX paths (src/ecb.ts SERIES_KEYS) and gate names (src/gates.ts).
  '''^[A-Z][A-Z0-9_]*(\.[A-Z0-9_]+)+$''',
  '''^(smh|nvda)BelowMA200$''',
  # Tranche leg-row ids in scripts/probe-*-tranches.ts (`key: "t1-price-hold"`, `t3-ma200`, …):
  # a t1–t3 prefix + 1–4 short lowercase words (letter-led, ≤9 chars; longest real one is 8,
  # `contract`/`rollover`). The length cap is the narrowing: a long lowercase random tail such as
  # `t1-f8a3c9e2b7d14056a9e3c1d7` is still flagged, as is any mixed-case value.
  '''^t[1-3](-[a-z][a-z0-9]{1,8}){1,4}$''',
  # `DISMISS_KEY` in public/disclaimer.js — a localStorage key NAME, not a
  # credential (`generic-api-key` fires on the `KEY = "…"` shape alone). Matched on the value so a
  # real key assigned to any other `*KEY` identifier in either file is still scanned.
  '''^cd-disclaimer-ack-v[0-9]+$''',
]

paths = [
  # Generated golden fixtures — regenerated by `npm run golden:regen`, never hand-authored.
  '''src/goldens/.*\.json''',
  # Preview/mock data and design-doc prose: no live credential is admitted to either.
  '''scripts/preview/mock-data\.mjs''',
  '''docs/.*\.md''',
  # DB snapshots (readings/alert_log/calibration rows) on a data-only `backups` branch (from a
  # separate backup repo, if fetched here) — ~176 MB per snapshot, one snapshot per commit. Regex-scanning them cost 3m37s of a
  # 3m38s gitleaks pass (measured 2026-09-05, 48 snapshot commits, 1.19 GB); allowlisted, 29 s.
  # scan-sec.sh ALSO drops the backups refs from `--all` so the diffs are never even generated;
  # this row is the safety net for a dump that lands on any other ref.
  '''supabase/backups/.*\.sql''',
]
